name: Bug 报告
description: 报告一个问题或 Bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题！请填写以下信息帮助我们定位。
  - type: dropdown
    id: project
    attributes:
      label: 涉及子项目
      options:
        - 智能体宇宙 (agent-universe)
        - UDOS 推演引擎 (udos-reasoning-engine)
        - 从像素到文明 (PixelToCivilization)
        - 整体集成 / 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述发生了什么
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行 '...'
        2. 点击 '...'
        3. 看到错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "如 v2.3.4 / v7.5.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
        - Android
        - iOS
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 粘贴相关日志或截图
    validations:
      required: false
