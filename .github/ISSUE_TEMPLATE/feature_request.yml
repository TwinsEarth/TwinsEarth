name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请详细描述你的想法。
  - type: dropdown
    id: project
    attributes:
      label: 涉及子项目
      options:
        - 智能体宇宙 (agent-universe)
        - UDOS 推演引擎 (udos-reasoning-engine)
        - 从像素到文明 (PixelToCivilization)
        - 整体集成 / 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么痛点？
      placeholder: 我经常遇到...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望如何实现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他方式
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、链接、参考项目等
    validations:
      required: false
