name: Release - 五平台安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  build-linux:
    name: 🐧 Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-universe/client/src-tauri
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: 前端
        working-directory: agent-universe/client
        run: |
          npm install
          npm run build
      - name: Tauri 构建
        working-directory: agent-universe/client
        run: npx tauri build
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: agent-universe/client/src-tauri/target/release/bundle/

  build-macos:
    name: 🍎 macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-universe/client/src-tauri
      - name: 前端
        working-directory: agent-universe/client
        run: |
          npm install
          npm run build
      - name: Tauri 构建
        working-directory: agent-universe/client
        run: npx tauri build
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: agent-universe/client/src-tauri/target/release/bundle/

  build-windows:
    name: 🪟 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-universe/client/src-tauri
      - name: 前端
        working-directory: agent-universe/client
        run: |
          npm install
          npm run build
      - name: Tauri 构建
        working-directory: agent-universe/client
        run: npx tauri build
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: agent-universe/client/src-tauri/target/release/bundle/

  build-android:
    name: 🤖 Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: 前端
        working-directory: agent-universe/client
        run: |
          npm install
          npm run build
      - name: Tauri Android 构建
        working-directory: agent-universe/client
        run: npx tauri android build
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: agent-universe/client/src-tauri/gen/android/app/build/outputs/apk/

  build-ios:
    name: 🍏 iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: 前端
        working-directory: agent-universe/client
        run: |
          npm install
          npm run build
      - name: Tauri iOS 构建
        working-directory: agent-universe/client
        run: npx tauri ios build
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: agent-universe/client/src-tauri/gen/apple/build/
